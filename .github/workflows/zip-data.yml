name: Build Data ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'route-data/shp-named-ungrouped/**'
      - 'route-data/kml-named/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create ZIP of SHP files
        run: |
          cd route-data/shp-named-ungrouped
          zip -r ../tfb-route-shp.zip .

      - name: Create ZIP of KML files
        run: |
          cd route-data/kml-named
          zip -r ../tfb-route-kml.zip .

      - name: Commit ZIPs back to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add route-data/tfb-route-shp.zip route-data/tfb-route-kml.zip
          git diff --staged --quiet || git commit -m "Auto-update data zips"
          git push
